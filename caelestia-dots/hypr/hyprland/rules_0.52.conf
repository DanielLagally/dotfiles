# ######## Window rules ########
windowrule = opacity $windowOpacity override, fullscreen 0

windowrule = opaque 1, match:class foot|equibop|org\.quickshell|imv|swappy  # They use native transparency or we want them opaque
windowrule = center 1, match:float 1, match:xwayland 0  # Center all floating windows (not xwayland cause popups)

# Float
windowrule = match:float 1, match:class guifetch  # FlafyDev/guifetch
windowrule = match:float 1, match:class yad
windowrule = match:float 1, match:class zenity
windowrule = match:float 1, match:class wev
windowrule = match:float 1, match:class org\.gnome\.FileRoller
windowrule = match:float 1, match:class file-roller  # WHY IS THERE TWOOOOOOOOOOOOOOOO
windowrule = match:float 1, match:class blueman-manager
windowrule = match:float 1, match:class com\.github\.GradienceTeam\.Gradience
windowrule = match:float 1, match:class feh
windowrule = match:float 1, match:class imv
windowrule = match:float 1, match:class system-config-printer
windowrule = match:float 1, match:class org\.quickshell

# Float, resize and center
windowrule = match:float 1, match:class foot, match:title nmtui
windowrule = size 60% 70%, match:class foot, match:title nmtui
windowrule = center 1, match:class foot, match:title nmtui
windowrule = match:float 1, match:class org\.gnome\.Settings
windowrule = size 70% 80%, match:class org\.gnome\.Settings
windowrule = center 1, match:class org\.gnome\.Settings
windowrule = match:float 1, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser
windowrule = size 60% 70%, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser
windowrule = center 1, match:class org\.pulseaudio\.pavucontrol|yad-icon-browser
windowrule = match:float 1, match:class nwg-look
windowrule = size 50% 60%, match:class nwg-look
windowrule = center 1, match:class nwg-look

# Special workspaces
windowrule = workspace special:sysmon, match:class btop
windowrule = workspace special:music, match:class feishin|Spotify|Supersonic
windowrule = workspace special:music, match:initial_title Spotify( Free)?  # Spotify wayland, it has no match:class  or some reason
windowrule = workspace special:music, match:title (.*)(Soundcloud)(.*) 
# windowrule = opacity 0.1, special:music, match:title (.*)(Soundcloud)(.*) 
windowrule = workspace special:communication, match:class discord|equibop|vesktop
windowrule = workspace special:whatsapp, match:class whatsapp|Altus
windowrule = workspace special:todo, match:class Todoist

# Dialogs
windowrule = match:float 1, match:title (Select|Open)( a)? (File|Folder)(s)?
windowrule = match:float 1, match:title File (Operation|Upload)( Progress)?
windowrule = match:float 1, match:title .* Properties
windowrule = match:float 1, match:title Export Image as PNG
windowrule = match:float 1, match:title GIMP Crash Debug
windowrule = match:float 1, match:title Save As
windowrule = match:float 1, match:title Library

# Picture in picture (resize and move done via script)
windowrule = move 100%-w-2% 100%-w-3%, match:title Picture(-| )in(-| )[Pp]icture  # Initial move so window doesn't shoot across the screen from the center
windowrule = keep_aspect_ratio 1, match:title Picture(-| )in(-| )[Pp]icture
windowrule = match:float 1, match:title Picture(-| )in(-| )[Pp]icture
windowrule = match:pin 1, match:title Picture(-| )in(-| )[Pp]icture

# Steam
windowrule = rounding 10, match:title (), match:class steam
# windowrule = match:float 1, match:title Friends List, match:class steam
windowrule = immediate 1, match:class steam_app_[0-9]+  # Allow tearing for steam games
windowrule = idle_inhibit always, match:class steam_app_[0-9]+  # Always idle inhibit when playing a steam game
# windowrule = 

# ATLauncher console
windowrule = match:float 1, match:class com-atlauncher-App, match:title ATLauncher Console

# Autodesk Fusion 360
windowrule = no_blur 1, match:title Fusion360|(Marking Menu), match:class fusion360\.exe

# Ugh xwayland popups
windowrule = no_dim 1, match:xwayland 1, match:title win[0-9]+
windowrule = no_shadow 1, match:xwayland 1, match:title win[0-9]+
windowrule = rounding 10, match:xwayland 1, match:title win[0-9]+

# ######## Workspace rules ########
workspace = w[tv1]s[false], gapsout:$singleWindowGapsOut
workspace = f[1]s[false], gapsout:$singleWindowGapsOut

# ######## Layer rules ########
layerrule = animation fade 1, match:namespace hyprpicker  # Colour picker out animation
layerrule = animation fade 1, match:namespace logout_dialog  # wlogout
layerrule = animation fade 1, match:namespace selection  # slurp
layerrule = animation fade 1, match:namespace wayfreeze

# Fuzzel
layerrule = animation popin 80%, match:namespace launcher
layerrule = blur 1, match:namespace launcher

# Shell
layerrule = no_anim 1, match:namespace caelestia-(border-exclusion|area-picker)
layerrule = animation fade, match:namespace caelestia-(drawers|background)

layerrule = blur 1,match:namespace caelestia-drawers
layerrule = ignore_alpha 0.57,match:namespace caelestia-drawers

