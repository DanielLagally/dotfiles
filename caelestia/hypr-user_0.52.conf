monitor = DP-1, 2560x1440@240, 0x0, 1.25, vrr, 2
monitor = DP-2, 1920x1080@144, -1920x0, 1, vrr, 2
monitor = eDP-1, 1920x1080@60, 0x0, 1.25

render {
    direct_scanout = 2
}

input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options = caps:super
    kb_rules =

    follow_mouse = 1

    repeat_rate = 25
    repeat_delay = 200

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    # accel_profile = custom 0.8 0.0 0.3 0.8 2.0 3.5
    accel_profile = flat

    scroll_method = on_button_down
    scroll_button = 274
    
    touchpad {
        natural_scroll = true
        scroll_factor = 0.5
    }
}

xwayland {
    force_zero_scaling = true
}

bind = SUPER, T, togglesplit
# bind = ALT, TAB, hyprtasking:toggle, all
# bind = SUPER, TAB, split:swapactiveworkspaces, current +1

plugin {
    hyprtasking {
        layout = grid

        gap_size = 0
        bg_color = 0xff26233a
        border_size = 0
        exit_on_hovered = false

        gestures {
            enabled = true
            move_fingers = 3
            move_distance = 300
            open_fingers = 4
            open_distance = 300
            open_positive = true
        }

        grid {
            rows = 3
            cols = 3
            loop = false
            gaps_use_aspect_ratio = false
        }

        linear {
            height = 400
            scroll_speed = 1.0
            blur = false
        }
    }
}

# Cursors
env = GDK_SCALE,1
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_SIZE,32
env = XCURSOR_THEME,BreezeX-RoséPine
env = XCURSOR_SIZE,24

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus 1,match:class ^$,match:title ^$,match:xwayland 1,match:float 1,match:fullscreen 0,match:pin 0

# fix tooltips (always have a title of `win.<id>`)
windowrule = no_initial_focus 1, match:class ^(.*jetbrains.*)$, match:title ^(win.*)$
windowrule = no_focus 1, match:class ^(.*jetbrains.*)$, match:title ^(win.*)$
# fix tab dragging (always have a single space character as their title)
windowrule = no_initial_focus 1, match:class ^(.*jetbrains.*)$, match:title ^\\s$
windowrule = no_focus 1, match:class ^(.*jetbrains.*)$, match:title ^\\s$


exec-once = fcitx5
exec-once = easyeffects --gapplication-service

# load all the plugins you installed
# exec-once = hyprctl plugin load "$HYPR_PLUGIN_DIR/lib/libhyprsplit.so"
# exec-once = hyprctl plugin load "$HYPR_PLUGIN_DIR/lib/libhyprtasking.so"
